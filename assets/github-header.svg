  <rect x="146" y="122" width="18" height="18" fill="#F0C040"/>
  <rect x="172" y="122" width="18" height="18" fill="#FF00AA"/>

  <rect x="1090" y="122" width="18" height="18" fill="#4488FF"/>
  <rect x="1116" y="122" width="18" height="18" fill="#AA44FF"/>
  <rect x="1142" y="122" width="18" height="18" fill="#FF8833"/>

  <rect x="128" y="292" width="192" height="10" fill="#F0C040"/>
  <rect x="960" y="292" width="192" height="10" fill="#F0C040"/>

